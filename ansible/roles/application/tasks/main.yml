---
- name: Install Python
  ansible.builtin.apt:
    name: python3
    state: present
    update_cache: true

- name: Create application group
  ansible.builtin.group:
    name: "{{ app_group }}"
    system: true
    state: present

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_directory }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Deploy Python application
  ansible.builtin.copy:
    src: server.py
    dest: "{{ app_directory }}/{{ app_script }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0644"
  notify: Restart application

- name: Deploy systemd service
  ansible.builtin.template:
    src: demo-app.service.j2
    dest: "/etc/systemd/system/{{ app_service }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart application

- name: Enable and start application
  ansible.builtin.systemd_service:
    name: "{{ app_service }}"
    enabled: true
    state: started
    daemon_reload: true

