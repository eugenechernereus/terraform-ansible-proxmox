---
- name: Configure database
  hosts: db
  become: true

  tasks:
    - name: Wait for SSH connection
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 5

    - name: Configure database
      ansible.builtin.import_role:
        name: database


- name: Configure application
  hosts: app
  become: true

  tasks:
    - name: Wait for SSH connection
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 5

    - name: Configure application
      ansible.builtin.import_role:
        name: application


- name: Configure reverse proxy
  hosts: web
  become: true

  tasks:
    - name: Wait for SSH connection
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 5

    - name: Configure reverse proxy
      ansible.builtin.import_role:
        name: reverse_proxy

